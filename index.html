<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portugol</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161c2c;
    --panel-2: #1c2436;
    --border: #2a3350;
    --text: #e6ebf5;
    --muted: #8b96b0;
    --accent: #4c9aff;
    --ok: #4caf78;
    --err: #ff6b6b;
    --prompt: #ffcb6b;
    --editor-bg: #11172480;
    --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: .5px;
    font-weight: 600;
  }
  header h1 .dot { color: var(--accent); }
  .spacer { flex: 1; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select, button {
    font-family: var(--font-ui);
    font-size: 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 12px;
    cursor: pointer;
  }
  select { padding-right: 8px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.stop { background: var(--panel-2); }
  button.stop:hover { border-color: var(--err); color: var(--err); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-header {
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Editor */
  .editor-wrap {
    flex: 1;
    display: flex;
    min-height: 0;
    background: var(--editor-bg);
    overflow: hidden;
  }
  .gutter {
    padding: 12px 8px 12px 12px;
    text-align: right;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    user-select: none;
    overflow: hidden;
    background: #0d121d;
    white-space: pre;
  }
  #code {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
  }

  /* Console */
  #console {
    flex: 1;
    overflow: auto;
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .out-line { white-space: pre-wrap; }
  .echo { color: var(--accent); }
  .err-msg { color: var(--err); }
  .ok-msg { color: var(--ok); }
  .sys-msg { color: var(--muted); font-style: italic; }
  .input-row { display: flex; align-items: center; gap: 6px; }
  .input-row .caret { color: var(--prompt); }
  .input-row input {
    flex: 1;
    background: transparent;
    border: 0;
    border-bottom: 1px dashed var(--prompt);
    color: var(--prompt);
    font-family: var(--font-mono);
    font-size: 14px;
    outline: none;
    padding: 2px 0;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <header>
    <h1>Portugol Tonhao<span class="dot">.</span></h1>
    <div class="spacer"></div>
    <div class="toolbar">
      <select id="examples" title="Exemplos">
        <option value="">Exemplos…</option>
      </select>
      <button id="clearBtn" title="Limpar console">Limpar</button>
      <button id="stopBtn" class="stop" disabled>◼ Parar</button>
      <button id="runBtn" class="primary">▶ Executar</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-header">Código</div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter">1</div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </section>
    <section class="pane">
      <div class="pane-header">Console</div>
      <div id="console"></div>
    </section>
  </main>

<script>
"use strict";
/* ============================================================================
   PORTUGOL — interpretador (léxico → sintático → interpretador com generator)
   Padrão custom:
     Algoritmo NOME (nome obrigatorio)
     DECLARE  var : tipo;
     Inicio ... Fim Algoritmo.
   Atribuicao: <-   |  Igualdade: =   |  Diferente: <> ou !=
   Tipos: inteiro real logico caractere cadeia literal
   Relacionais: > < >= <=   |  Aritmetica: + - * /  mod (ou %)
   Logicos: e ou nao (ou && || !)
   se (cond) entao ... senao ... fim se;
   para i <- 1 ate N [passo P] faca ... Fim para;
   enquanto (cond) faca ... Fim enquanto;
   Palavras-chave: sem distincao de maiusculas/minusculas nem acentos.
   ========================================================================== */

/* ---------------------------------------------------------------- utilidades */
function foldKeyword(s) {
  // normaliza para casar palavra-chave: minusculo e sem acento
  return s.toLowerCase()
          .normalize("NFD").replace(/[̀-ͯ]/g, "");
}

class PortugolError extends Error {
  constructor(msg, line) { super(msg); this.line = line; }
}

/* ------------------------------------------------------------------ LÉXICO */
const KEYWORDS = new Set([
  "algoritmo","declare","inicio","fim","se","entao","senao",
  "enquanto","faca","para","ate","passo","leia","escreva","escreval",
  "e","ou","nao","mod","verdadeiro","falso","vetor","de","tipo","registro",
  "procedimento","var",
  "inteiro","real","logico","caractere","cadeia","literal"
]);
const TYPES = new Set(["inteiro","real","logico","caractere","cadeia","literal"]);

function lex(src) {
  const tokens = [];
  let i = 0, line = 1;
  const n = src.length;

  const push = (type, value) => tokens.push({ type, value, line });

  while (i < n) {
    const c = src[i];

    // quebra de linha
    if (c === "\n") { line++; i++; continue; }
    // espacos
    if (c === " " || c === "\t" || c === "\r") { i++; continue; }

    // comentario de linha  //  (e tambem estilo VisuAlg)
    if (c === "/" && src[i+1] === "/") {
      while (i < n && src[i] !== "\n") i++;
      continue;
    }
    // comentario de bloco  /* ... */
    if (c === "/" && src[i+1] === "*") {
      i += 2;
      while (i < n && !(src[i] === "*" && src[i+1] === "/")) { if (src[i] === "\n") line++; i++; }
      i += 2;
      continue;
    }
    // comentario Pascal  { ... }
    if (c === "{") {
      i++;
      while (i < n && src[i] !== "}") { if (src[i] === "\n") line++; i++; }
      i++;
      continue;
    }

    // numeros
    if (c >= "0" && c <= "9") {
      let start = i;
      while (i < n && src[i] >= "0" && src[i] <= "9") i++;
      let isReal = false;
      if (src[i] === "." && src[i+1] >= "0" && src[i+1] <= "9") {
        isReal = true; i++;
        while (i < n && src[i] >= "0" && src[i] <= "9") i++;
      }
      const text = src.slice(start, i);
      push("num", { value: parseFloat(text), isReal });
      continue;
    }

    // strings  "..."  ou  '...'
    if (c === '"' || c === "'") {
      const quote = c; i++;
      let str = "";
      while (i < n && src[i] !== quote) {
        if (src[i] === "\\") {
          const nx = src[i+1];
          if (nx === "n") str += "\n";
          else if (nx === "t") str += "\t";
          else if (nx === "\\") str += "\\";
          else if (nx === quote) str += quote;
          else str += nx;
          i += 2;
        } else {
          if (src[i] === "\n") line++;
          str += src[i]; i++;
        }
      }
      if (i >= n) throw new PortugolError("Texto não fechado (falta fechar as aspas).", line);
      i++; // fecha aspas
      push("str", str);
      continue;
    }

    // identificadores / palavras-chave
    if (/[A-Za-zÀ-ÿ_]/.test(c)) {
      let start = i;
      while (i < n && /[A-Za-zÀ-ÿ0-9_]/.test(src[i])) i++;
      const raw = src.slice(start, i);
      const key = foldKeyword(raw);
      if (KEYWORDS.has(key)) push("kw", key);
      else push("id", { raw, key });
      continue;
    }

    // operadores e pontuacao (2 chars primeiro)
    const two = src.substr(i, 2);
    if (two === "..") { push("range", ".."); i += 2; continue; }
    if (two === "<-") { push("op", "<-"); i += 2; continue; }
    if (two === "<>") { push("op", "<>"); i += 2; continue; }
    if (two === "!=") { push("op", "<>"); i += 2; continue; }
    if (two === ">=") { push("op", ">="); i += 2; continue; }
    if (two === "<=") { push("op", "<="); i += 2; continue; }
    if (two === "&&") { push("op", "e"); i += 2; continue; }
    if (two === "||") { push("op", "ou"); i += 2; continue; }

    if ("+-*/%".includes(c)) { push("op", c); i++; continue; }
    if (c === "=") { push("op", "="); i++; continue; }
    if (c === ">") { push("op", ">"); i++; continue; }
    if (c === "<") { push("op", "<"); i++; continue; }
    if (c === "!") { push("op", "nao"); i++; continue; }
    if (c === "(") { push("lparen", "("); i++; continue; }
    if (c === ")") { push("rparen", ")"); i++; continue; }
    if (c === "[") { push("lbracket", "["); i++; continue; }
    if (c === "]") { push("rbracket", "]"); i++; continue; }
    if (c === ",") { push("comma", ","); i++; continue; }
    if (c === ";") { push("semi", ";"); i++; continue; }
    if (c === ":") { push("colon", ":"); i++; continue; }
    if (c === ".") { push("dot", "."); i++; continue; }

    throw new PortugolError(`Caractere inesperado: "${c}"`, line);
  }
  push("eof", null);
  return tokens;
}

/* ---------------------------------------------------------------- SINTÁTICO */
function parse(tokens) {
  let p = 0;
  const registros = Object.create(null);   // tipos registro definidos: chave -> {raw, fields}
  const peek = () => tokens[p];
  const next = () => tokens[p++];
  const atEnd = () => peek().type === "eof";

  const isKw = (k) => peek().type === "kw" && peek().value === k;
  const isOp = (o) => peek().type === "op" && peek().value === o;

  function err(msg) { throw new PortugolError(msg, peek().line); }

  function expectKw(k) {
    if (!isKw(k)) err(`Esperava "${k}" mas encontrei "${tokenText(peek())}".`);
    return next();
  }
  function expect(type, label) {
    if (peek().type !== type) err(`Esperava ${label} mas encontrei "${tokenText(peek())}".`);
    return next();
  }
  function tokenText(t) {
    if (t.type === "eof") return "fim do código";
    if (t.type === "id") return t.value.raw;
    if (t.type === "num") return String(t.value.value);
    if (t.type === "str") return `"${t.value}"`;
    return t.value;
  }
  // lê um nome (variável/algoritmo); se vier palavra reservada, avisa com clareza
  function leNome(contexto) {
    if (peek().type === "kw")
      err(`"${tokenText(peek())}" é uma palavra reservada e não pode ser usada como ${contexto}. Escolha outro nome.`);
    return expect("id", contexto).value;
  }

  // ---- programa
  function parsePrograma() {
    expectKw("algoritmo");
    if (peek().type !== "id" && peek().type !== "kw")
      err("O algoritmo precisa de um nome depois de 'Algoritmo'.");
    const nome = leNome("nome do algoritmo").raw;
    if (peek().type === "semi") next();   // ';' opcional depois do nome do algoritmo

    // seções Tipo / Declare / Procedimento podem vir em qualquer ordem antes do Inicio
    const decls = [];
    const procedimentos = Object.create(null);
    while (isKw("tipo") || isKw("declare") || isKw("procedimento")) {
      if (isKw("tipo")) parseRegistroDef();
      else if (isKw("declare")) { next(); parseDeclsInto(decls); }
      else parseProcedimento(procedimentos);
    }

    expectKw("inicio");
    const corpo = parseBloco();
    expectKw("fim");
    expectKw("algoritmo");
    // aceita ".", ";" ou fim do arquivo apos "Fim Algoritmo"
    if (peek().type === "dot" || peek().type === "semi") next();

    return { nome, registros, procedimentos, decls, corpo };
  }

  // lê linhas de declaração (depois do 'Declare' já consumido), até acabar o bloco
  function parseDeclsInto(decls) {
    const pareceDecl = () =>
      peek().type === "id" ||
      (peek().type === "kw" && tokens[p+1] &&
       (tokens[p+1].type === "colon" || tokens[p+1].type === "comma"));
    while (pareceDecl()) {
      const names = [ leNome("um nome de variável") ];
      while (peek().type === "comma") { next(); names.push(leNome("um nome de variável")); }
      expect("colon", "':' (para indicar o tipo)");
      const tipo = parseTipo();
      expect("semi", "';' ao final da declaração");
      for (const nm of names) decls.push({ name: nm.key, raw: nm.raw, tipo });
    }
  }

  // ---- procedimento: Procedimento nome [(params)] [Declare ...] Inicio ... Fim procedimento;
  function parseProcedimento(procs) {
    expectKw("procedimento");
    const nomeTok = leNome("nome do procedimento");
    if (procs[nomeTok.key])
      err(`Procedimento "${nomeTok.raw}" definido mais de uma vez.`);
    const params = [];
    if (peek().type === "lparen") {
      next();
      if (peek().type !== "rparen") {
        parseParamGroup(params);
        while (peek().type === "semi" || peek().type === "comma") {
          next();
          if (peek().type === "rparen") break;
          parseParamGroup(params);
        }
      }
      expect("rparen", "')' ao final dos parâmetros");
    }
    const pdecls = [];
    if (isKw("declare")) { next(); parseDeclsInto(pdecls); }
    expectKw("inicio");
    const corpo = parseBloco();
    expectKw("fim");
    expectKw("procedimento");
    if (peek().type === "semi" || peek().type === "dot") next();   // ';' depois de 'Fim procedimento'
    procs[nomeTok.key] = { raw: nomeTok.raw, params, decls: pdecls, corpo };
  }

  // grupo de parâmetros:  [var] nome[, nome...] : <tipo escalar ou registro>
  function parseParamGroup(params) {
    let porRef = false;
    if (isKw("var")) { next(); porRef = true; }
    const names = [ leNome("um nome de parâmetro") ];
    while (peek().type === "comma") { next(); names.push(leNome("um nome de parâmetro")); }
    expect("colon", "':' para o tipo do parâmetro");
    const tipo = parseTipo();   // escalar, registro ou vetor
    for (const nm of names) params.push({ name: nm.key, raw: nm.raw, tipo, porRef });
  }

  // chamada de procedimento como comando:  nome;  ou  nome(arg, arg, ...);
  function parseChamada() {
    const nomeTok = expect("id", "o nome de um procedimento").value;
    const line = tokens[p-1].line;
    const args = [];
    if (peek().type === "lparen") {
      next();
      if (peek().type !== "rparen") {
        args.push(parseExpr());
        while (peek().type === "comma") { next(); args.push(parseExpr()); }
      }
      expect("rparen", "')' ao final dos argumentos");
    }
    expect("semi", "';' ao final da chamada");
    return { type: "chamada", name: nomeTok.key, raw: nomeTok.raw, args, line };
  }

  // ---- definição de registro:  Tipo Nome : registro  campo:tipo; ...  Fim registro;
  function parseRegistroDef() {
    expectKw("tipo");
    const nomeTok = leNome("nome do tipo (registro)");
    if (registros[nomeTok.key])
      err(`Tipo "${nomeTok.raw}" definido mais de uma vez.`);
    expect("colon", "':' depois do nome do tipo");
    expectKw("registro");
    const fields = [];
    const vistos = Object.create(null);
    while (!isKw("fim") && !atEnd()) {
      const fnames = [ leNome("um nome de campo") ];
      while (peek().type === "comma") { next(); fnames.push(leNome("um nome de campo")); }
      expect("colon", "':' para indicar o tipo do campo");
      const ftipo = parseTipoEscalar();   // campos escalares por enquanto
      expect("semi", "';' ao final do campo");
      for (const fn of fnames) {
        if (vistos[fn.key]) err(`Campo "${fn.raw}" repetido no registro "${nomeTok.raw}".`);
        vistos[fn.key] = true;
        fields.push({ name: fn.key, raw: fn.raw, tipo: ftipo });
      }
    }
    expectKw("fim");
    expectKw("registro");
    expect("semi", "';' depois de 'Fim registro'");
    registros[nomeTok.key] = { raw: nomeTok.raw, fields };
  }

  // ---- tipo: escalar (inteiro, real, ...) ou vetor[lo..hi; ...] de <base>
  function parseTipoEscalar() {
    if (!(peek().type === "kw" && TYPES.has(peek().value)))
      err("Esperava um tipo (inteiro, real, logico, caractere, cadeia ou literal).");
    return next().value;
  }
  // tipo base de uma variável ou de um vetor: escalar OU um registro já definido
  function parseBase() {
    if (peek().type === "kw" && TYPES.has(peek().value)) return next().value;
    if (peek().type === "id") {
      const t = next().value;
      if (!registros[t.key])
        err(`Tipo "${t.raw}" não foi definido. Defina 'Tipo ${t.raw} : registro ... Fim registro;' antes do DECLARE.`);
      return { record: t.key, raw: t.raw };
    }
    err("Esperava um tipo (inteiro, real, logico, caractere, cadeia, literal) ou um registro definido.");
  }
  function parseTipo() {
    if (!isKw("vetor")) return parseBase();
    next(); // vetor
    expect("lbracket", "'[' para as dimensões do vetor");
    const dims = [];
    do {
      const lo = parseExpr();
      expect("range", "'..' entre o menor e o maior índice (ex: 1..5)");
      const hi = parseExpr();
      dims.push({ lo, hi });
    } while (aceitaSepDim());
    expect("rbracket", "']' ao final das dimensões do vetor");
    expectKw("de");
    const base = parseBase();
    return { array: true, dims, base };
  }
  // separadores de dimensão/índice: aceita ';' ou ','
  function aceitaSepDim() {
    if (peek().type === "semi" || peek().type === "comma") { next(); return true; }
    return false;
  }

  // ---- bloco: sequência de comandos até 'fim' ou 'senao'
  function parseBloco() {
    const stmts = [];
    while (!atEnd() && !isKw("fim") && !isKw("senao")) {
      stmts.push(parseComando());
    }
    return stmts;
  }

  function parseComando() {
    const t = peek();
    if (t.type === "kw") {
      switch (t.value) {
        case "leia":     return parseLeia();
        case "escreva":
        case "escreval": return parseEscreva();
        case "se":       return parseSe();
        case "para":     return parsePara();
        case "enquanto": return parseEnquanto();
        default: err(`Comando inesperado: "${t.value}".`);
      }
    }
    if (t.type === "id") {
      // chamada de procedimento: id seguido de '(' ou ';'  (senão é atribuição)
      const nx = tokens[p+1];
      if (nx && (nx.type === "lparen" || nx.type === "semi")) return parseChamada();
      return parseAtribuicao();
    }
    err(`Comando inválido começando em "${tokenText(t)}".`);
  }

  // lê os índices de um vetor:  [ e1 (; ou ,) e2 ... ]
  function parseIndices() {
    expect("lbracket", "'[' para o índice do vetor");
    const idx = [ parseExpr() ];
    while (aceitaSepDim()) idx.push(parseExpr());
    expect("rbracket", "']' depois do índice do vetor");
    return idx;
  }
  // lê um destino: nome | nome[i] | nome[i;j] | nome.campo | nome[i].campo
  function parseLValue() {
    const alvo = leNome("uma variável");
    const line = tokens[p-1].line;
    const indices = (peek().type === "lbracket") ? parseIndices() : null;
    let field = null, fieldRaw = null;
    if (peek().type === "dot") {
      next();
      const f = leNome("um nome de campo");
      field = f.key; fieldRaw = f.raw;
    }
    return { name: alvo.key, raw: alvo.raw, indices, field, fieldRaw, line };
  }

  function parseAtribuicao() {
    const alvo = parseLValue();
    if (!isOp("<-")) err(`Esperava '<-' para atribuir um valor a "${alvo.raw}".`);
    next();
    const expr = parseExpr();
    expect("semi", "';' ao final do comando");
    return { type: "store", alvo, expr, line: alvo.line };
  }

  function parseLeia() {
    const line = peek().line;
    next();
    expect("lparen", "'(' depois de leia");
    const alvos = [ parseLValue() ];
    while (peek().type === "comma") { next(); alvos.push(parseLValue()); }
    expect("rparen", "')'");
    expect("semi", "';'");
    return { type: "leia", alvos, line };
  }

  function parseEscreva() {
    const line = peek().line;
    next();
    expect("lparen", "'(' depois de escreva");
    const args = [];
    if (peek().type !== "rparen") {
      args.push(parseExpr());
      while (peek().type === "comma") { next(); args.push(parseExpr()); }
    }
    expect("rparen", "')'");
    expect("semi", "';'");
    return { type: "escreva", args, line };
  }

  function parseSe() {
    const line = peek().line;
    next();
    const cond = parseExpr();
    expectKw("entao");
    const entao = parseBloco();
    let senao = null;
    if (isKw("senao")) { next(); senao = parseBloco(); }
    expectKw("fim");
    expectKw("se");
    expect("semi", "';' depois de 'fim se'");
    return { type: "se", cond, entao, senao, line };
  }

  function parsePara() {
    const line = peek().line;
    next();
    const varTok = leNome("uma variável de controle");
    if (!isOp("<-")) err("Esperava '<-' para o valor inicial do 'para'.");
    next();
    const inicio = parseExpr();
    expectKw("ate");
    const fim = parseExpr();
    let passo = null;
    if (isKw("passo")) { next(); passo = parseExpr(); }
    expectKw("faca");
    const corpo = parseBloco();
    expectKw("fim");
    expectKw("para");
    expect("semi", "';' depois de 'fim para'");
    return { type: "para", varName: varTok.key, raw: varTok.raw, inicio, fim, passo, corpo, line };
  }

  function parseEnquanto() {
    const line = peek().line;
    next();
    const cond = parseExpr();
    expectKw("faca");
    const corpo = parseBloco();
    expectKw("fim");
    expectKw("enquanto");
    expect("semi", "';' depois de 'fim enquanto'");
    return { type: "enquanto", cond, corpo, line };
  }

  /* ---- expressões (precedência) ----
     ou > e > nao > relacional > aditivo > multiplicativo > unario > primario  */
  function parseExpr() { return parseOu(); }

  function parseOu() {
    let left = parseE();
    while (isKw("ou") || isOp("ou")) { const line = peek().line; next(); left = { type:"bin", op:"ou", left, right: parseE(), line }; }
    return left;
  }
  function parseE() {
    let left = parseNao();
    while (isKw("e") || isOp("e")) { const line = peek().line; next(); left = { type:"bin", op:"e", left, right: parseNao(), line }; }
    return left;
  }
  function parseNao() {
    if (isKw("nao") || isOp("nao")) { const line = peek().line; next(); return { type:"un", op:"nao", expr: parseNao(), line }; }
    return parseRel();
  }
  function parseRel() {
    let left = parseAdd();
    while (peek().type === "op" && ["=","<>",">","<",">=","<="].includes(peek().value)) {
      const op = next().value; const line = tokens[p-1].line;
      left = { type:"bin", op, left, right: parseAdd(), line };
    }
    return left;
  }
  function parseAdd() {
    let left = parseMul();
    while (peek().type === "op" && (peek().value === "+" || peek().value === "-")) {
      const op = next().value; const line = tokens[p-1].line;
      left = { type:"bin", op, left, right: parseMul(), line };
    }
    return left;
  }
  function parseMul() {
    let left = parseUnario();
    while ((peek().type === "op" && ["*","/","%"].includes(peek().value)) || isKw("mod")) {
      const op = isKw("mod") ? "mod" : next().value;
      if (op === "mod") next();
      const line = tokens[p-1] ? tokens[p-1].line : peek().line;
      left = { type:"bin", op: op === "%" ? "mod" : op, left, right: parseUnario(), line };
    }
    return left;
  }
  function parseUnario() {
    if (peek().type === "op" && (peek().value === "-" || peek().value === "+")) {
      const op = next().value; const line = tokens[p-1].line;
      return { type:"un", op, expr: parseUnario(), line };
    }
    return parsePrimario();
  }
  function parsePrimario() {
    const t = peek();
    if (t.type === "num") { next(); return { type:"num", value: t.value.value, isReal: t.value.isReal, line: t.line }; }
    if (t.type === "str") { next(); return { type:"str", value: t.value, line: t.line }; }
    if (t.type === "kw" && t.value === "verdadeiro") { next(); return { type:"bool", value: true, line: t.line }; }
    if (t.type === "kw" && t.value === "falso") { next(); return { type:"bool", value: false, line: t.line }; }
    if (t.type === "id") {
      next();
      let node;
      if (peek().type === "lbracket") {
        const indices = parseIndices();
        node = { type:"index", name: t.value.key, raw: t.value.raw, indices, line: t.line };
      } else {
        node = { type:"var", name: t.value.key, raw: t.value.raw, line: t.line };
      }
      if (peek().type === "dot") {
        next();
        const f = leNome("um nome de campo");
        node = { type:"field", base: node, field: f.key, fieldRaw: f.raw, raw: t.value.raw, line: t.line };
      }
      return node;
    }
    if (t.type === "lparen") { next(); const e = parseExpr(); expect("rparen", "')'"); return e; }
    err(`Esperava um valor ou expressão, mas encontrei "${tokenText(t)}".`);
  }

  const programa = parsePrograma();
  if (!atEnd()) err(`Código extra depois do fim do algoritmo: "${tokenText(peek())}".`);
  return programa;
}

/* -------------------------------------------------------------- INTERPRETADOR
   Generator: dá `yield` num evento {kind:'output'|'input'} e retoma depois.  */

function tipoPadrao(tipo) {
  switch (tipo) {
    case "inteiro":
    case "real": return 0;
    case "logico": return false;
    default: return "";
  }
}

function ehNumerico(tipo) { return tipo === "inteiro" || tipo === "real"; }

function formataValor(v) {
  if (typeof v === "boolean") return v ? "verdadeiro" : "falso";
  if (typeof v === "number") {
    if (Number.isInteger(v)) return String(v);
    return String(v);
  }
  return String(v);
}

function* interpretar(programa) {
  const MAX_PASSOS = 5_000_000;
  let passos = 0;

  const registros = programa.registros || Object.create(null);
  const procedimentos = programa.procedimentos || Object.create(null);

  // --- escopos: global + escopo do procedimento em execução ---
  function criaEscopo(pai) {
    return { tipos: Object.create(null), store: Object.create(null), refs: Object.create(null), pai };
  }
  const global = criaEscopo(null);
  let escopo = global;

  // acha o escopo que declara 'name' (escopo atual; senão o global)
  function achaEscopo(name) {
    if (name in escopo.tipos) return escopo;
    if (escopo !== global && name in global.tipos) return global;
    return null;
  }

  // inicializa as variáveis de um conjunto de declarações num escopo
  function inicializaDecls(decls, esc) {
    for (const d of decls) {
      if (esc.tipos[d.name] !== undefined)
        throw new PortugolError(`Variável "${d.raw}" declarada mais de uma vez.`, undefined);
      if (d.tipo && d.tipo.array) {
        const info = montaVetor(d.tipo, d.raw);
        esc.tipos[d.name] = info;
        const arr = new Array(info.total);
        for (let k = 0; k < info.total; k++) arr[k] = valorPadrao(info.base);
        esc.store[d.name] = arr;
      } else {
        esc.tipos[d.name] = d.tipo;
        esc.store[d.name] = valorPadrao(d.tipo);
      }
    }
  }

  inicializaDecls(programa.decls, global);

  // valor inicial de um tipo base: escalar (string) ou registro ({record})
  function valorPadrao(base) {
    if (base && base.record) return novoRegistro(base.record);
    return tipoPadrao(base);
  }
  function novoRegistro(recKey) {
    const def = registros[recKey];
    const obj = Object.create(null);
    for (const f of def.fields) obj[f.name] = valorPadrao(f.tipo);
    return obj;
  }
  function campoDe(recKey, fieldKey, fieldRaw, line) {
    const def = registros[recKey];
    for (const f of def.fields) if (f.name === fieldKey) return f;
    throw new PortugolError(`O registro "${def.raw}" não tem o campo "${fieldRaw}".`, line);
  }

  // avalia os limites do vetor (constantes) e pré-calcula tamanhos
  function montaVetor(tipo, raw) {
    const dims = tipo.dims.map(dm => {
      const lo = avalia(dm.lo), hi = avalia(dm.hi);
      if (!Number.isInteger(lo) || !Number.isInteger(hi))
        throw new PortugolError(`Os limites do vetor "${raw}" devem ser inteiros.`, undefined);
      if (hi < lo)
        throw new PortugolError(`No vetor "${raw}" o índice final (${hi}) é menor que o inicial (${lo}).`, undefined);
      return { lo, hi, size: hi - lo + 1 };
    });
    const total = dims.reduce((acc, dm) => acc * dm.size, 1);
    return { array: true, base: tipo.base, dims, total };
  }

  // calcula a posição linear a partir dos índices (row-major), checando limites
  function calculaOffset(info, idxs, raw, line) {
    if (idxs.length !== info.dims.length)
      throw new PortugolError(`"${raw}" tem ${info.dims.length} dimensão(ões), mas usei ${idxs.length} índice(s).`, line);
    let off = 0;
    for (let k = 0; k < idxs.length; k++) {
      const i = idxs[k], dm = info.dims[k];
      if (!Number.isInteger(i))
        throw new PortugolError(`O índice de "${raw}" precisa ser um número inteiro.`, line);
      if (i < dm.lo || i > dm.hi)
        throw new PortugolError(`Índice ${i} fora dos limites de "${raw}" (${dm.lo}..${dm.hi}).`, line);
      off = off * dm.size + (i - dm.lo);
    }
    return off;
  }

  // coage um valor para um tipo escalar (inteiro, real, logico, caractere, ...)
  function coageEscalar(tipo, valor, line, nome) {
    if (ehNumerico(tipo)) {
      if (typeof valor !== "number")
        throw new PortugolError(`Não dá pra guardar esse valor em "${nome}" (${tipo}).`, line);
      if (tipo === "inteiro" && !Number.isInteger(valor))
        throw new PortugolError(`"${nome}" é inteiro, mas o valor ${valor} tem casas decimais.`, line);
      return valor;
    }
    if (tipo === "logico") {
      if (typeof valor !== "boolean")
        throw new PortugolError(`"${nome}" é logico e só aceita verdadeiro/falso.`, line);
      return valor;
    }
    // caractere / cadeia / literal
    let s = formataValor(valor);
    if (tipo === "caractere" && s.length > 1) s = s.slice(0, 1);
    return s;
  }

  // resolve um destino (nome | nome[i] | nome.campo | nome[i].campo) para uma
  // referência { container, key, info, rotulo }. 'info' pode ser escalar, {array} ou {record}.
  // Respeita o escopo atual (locais + globais) e os parâmetros por referência (refs).
  function resolveRef(alvo, line) {
    const esc = achaEscopo(alvo.name);
    if (!esc)
      throw new PortugolError(`Variável "${alvo.raw}" não foi declarada.`, line);
    const info = esc.tipos[alvo.name];
    let cont, key;
    if (alvo.name in esc.refs) { const r = esc.refs[alvo.name]; cont = r.container; key = r.key; }
    else { cont = esc.store; key = alvo.name; }

    if (alvo.indices) {
      if (!(info && info.array))
        throw new PortugolError(`"${alvo.raw}" não é um vetor, então não aceita índice.`, line);
      const idxs = alvo.indices.map(e => avalia(e));
      const off = calculaOffset(info, idxs, alvo.raw, line);
      const arr = cont[key];
      if (alvo.field) {
        if (!(info.base && info.base.record))
          throw new PortugolError(`"${alvo.raw}" não é um vetor de registro; não tem campos.`, line);
        const rec = arr[off];
        const f = campoDe(info.base.record, alvo.field, alvo.fieldRaw, line);
        return { container: rec, key: alvo.field, info: f.tipo, rotulo: `${alvo.raw}[..].${alvo.fieldRaw}` };
      }
      return { container: arr, key: off, info: info.base, rotulo: `${alvo.raw}[..]` };
    }

    if (alvo.field) {
      if (!(info && info.record))
        throw new PortugolError(`"${alvo.raw}" não é um registro; não tem campos.`, line);
      const rec = cont[key];
      const f = campoDe(info.record, alvo.field, alvo.fieldRaw, line);
      return { container: rec, key: alvo.field, info: f.tipo, rotulo: `${alvo.raw}.${alvo.fieldRaw}` };
    }

    return { container: cont, key, info, rotulo: alvo.raw };
  }

  // como resolveRef, mas exige uma CÉLULA ESCALAR (para store, leia e o laço 'para')
  function localAlvo(alvo, line) {
    const r = resolveRef(alvo, line);
    if (r.info && r.info.array)
      throw new PortugolError(`"${r.rotulo}" é um vetor; use um índice, ex: ${r.rotulo}[1].`, line);
    if (r.info && r.info.record)
      throw new PortugolError(`"${r.rotulo}" é um registro; use um campo, ex: ${r.rotulo}.campo.`, line);
    return { container: r.container, key: r.key, tipoEsc: r.info, rotulo: r.rotulo };
  }

  // lê o valor escalar de um alvo
  function leRef(alvo, line) {
    const r = localAlvo(alvo, line);
    return r.container[r.key];
  }

  function avalia(node) {
    switch (node.type) {
      case "num": return node.value;
      case "str": return node.value;
      case "bool": return node.value;
      case "var":
        return leRef({ name: node.name, raw: node.raw, indices: null, field: null }, node.line);
      case "index":
        return leRef({ name: node.name, raw: node.raw, indices: node.indices, field: null }, node.line);
      case "field":
        return leRef({
          name: node.base.name, raw: node.base.raw,
          indices: node.base.indices || null,
          field: node.field, fieldRaw: node.fieldRaw
        }, node.line);
      case "un": {
        const v = avalia(node.expr);
        if (node.op === "-") return -numero(v, node.line);
        if (node.op === "+") return  numero(v, node.line);
        if (node.op === "nao") return !logico(v, node.line);
      }
      case "bin": return binario(node);
      default: throw new PortugolError("Expressão desconhecida.", node.line);
    }
  }

  function numero(v, line) {
    if (typeof v !== "number") throw new PortugolError("Esperava um número nesta operação.", line);
    return v;
  }
  function logico(v, line) {
    if (typeof v !== "boolean") throw new PortugolError("Esperava um valor lógico (verdadeiro/falso).", line);
    return v;
  }

  function binario(node) {
    const op = node.op;
    if (op === "e")  return logico(avalia(node.left), node.line) && logico(avalia(node.right), node.line);
    if (op === "ou") return logico(avalia(node.left), node.line) || logico(avalia(node.right), node.line);

    const a = avalia(node.left);
    const b = avalia(node.right);

    if (op === "=")  return igual(a, b);
    if (op === "<>") return !igual(a, b);

    if (op === "+") {
      if (typeof a === "string" || typeof b === "string") return formataValor(a) + formataValor(b);
      return numero(a, node.line) + numero(b, node.line);
    }
    if (op === "-") return numero(a, node.line) - numero(b, node.line);
    if (op === "*") return numero(a, node.line) * numero(b, node.line);
    if (op === "/") {
      const d = numero(b, node.line);
      if (d === 0) throw new PortugolError("Divisão por zero.", node.line);
      return numero(a, node.line) / d;
    }
    if (op === "mod") {
      const d = numero(b, node.line);
      if (d === 0) throw new PortugolError("Resto de divisão por zero.", node.line);
      return numero(a, node.line) % d;
    }
    // relacionais
    const x = numero(a, node.line), y = numero(b, node.line);
    if (op === ">")  return x >  y;
    if (op === "<")  return x <  y;
    if (op === ">=") return x >= y;
    if (op === "<=") return x <= y;
    throw new PortugolError(`Operador desconhecido: ${op}.`, node.line);
  }

  function igual(a, b) {
    if (typeof a === "number" && typeof b === "number") return a === b;
    if (typeof a === "boolean" && typeof b === "boolean") return a === b;
    return formataValor(a) === formataValor(b);
  }

  function converteEntrada(txt, tipo, name, line) {
    const s = txt.trim();
    if (tipo === "inteiro") {
      if (!/^[+-]?\d+$/.test(s)) throw new PortugolError(`"${name}" é inteiro; "${txt}" não é um número inteiro válido.`, line);
      return parseInt(s, 10);
    }
    if (tipo === "real") {
      const norm = s.replace(",", ".");
      if (!/^[+-]?\d+(\.\d+)?$/.test(norm)) throw new PortugolError(`"${name}" é real; "${txt}" não é um número válido.`, line);
      return parseFloat(norm);
    }
    if (tipo === "logico") {
      const f = foldKeyword(s);
      if (["verdadeiro","v","true","sim","1"].includes(f)) return true;
      if (["falso","f","false","nao","0"].includes(f)) return false;
      throw new PortugolError(`"${name}" é logico; digite verdadeiro ou falso.`, line);
    }
    if (tipo === "caractere") return s.slice(0, 1);
    return txt; // cadeia / literal
  }

  // ---- execução (generator)
  function* execBloco(stmts) {
    for (const s of stmts) yield* execComando(s);
  }

  function* execComando(s) {
    if (++passos > MAX_PASSOS)
      throw new PortugolError("Execução interrompida: possível laço infinito (muitos passos).", s.line);

    switch (s.type) {
      case "store": {
        const ref = localAlvo(s.alvo, s.line);
        ref.container[ref.key] = coageEscalar(ref.tipoEsc, avalia(s.expr), s.line, ref.rotulo);
        break;
      }
      case "leia": {
        for (const alvo of s.alvos) {
          const ref = localAlvo(alvo, s.line);
          const txt = yield { kind: "input", name: ref.rotulo, tipo: ref.tipoEsc };
          ref.container[ref.key] = converteEntrada(txt, ref.tipoEsc, ref.rotulo, s.line);
        }
        break;
      }
      case "escreva": {
        const texto = s.args.map(a => formataValor(avalia(a))).join("");
        yield { kind: "output", text: texto + "\n" };
        break;
      }
      case "se": {
        if (logico(avalia(s.cond), s.line)) yield* execBloco(s.entao);
        else if (s.senao) yield* execBloco(s.senao);
        break;
      }
      case "enquanto": {
        while (logico(avalia(s.cond), s.line)) {
          if (++passos > MAX_PASSOS) throw new PortugolError("Execução interrompida: possível laço infinito.", s.line);
          yield* execBloco(s.corpo);
        }
        break;
      }
      case "para": {
        const refc = localAlvo({ name: s.varName, raw: s.raw, indices: null, field: null }, s.line);
        const inicio = numero(avalia(s.inicio), s.line);
        const limite = numero(avalia(s.fim), s.line);
        // 'passo' é OPCIONAL: só há incremento automático quando ele é escrito.
        // Sem 'passo', quem avança a variável de controle é o próprio corpo
        // (ex: i <- i + 1); não incrementar => laço roda até o limite de passos.
        const temPasso = s.passo != null;
        const passo = temPasso ? numero(avalia(s.passo), s.line) : 0;
        if (temPasso && passo === 0) throw new PortugolError("O 'passo' não pode ser zero.", s.line);
        // direção da condição de parada: pelo sinal do passo, ou (sem passo) por inicio/limite
        const subindo = temPasso ? (passo > 0) : (inicio <= limite);
        const le = () => refc.container[refc.key];
        refc.container[refc.key] = coageEscalar(refc.tipoEsc, inicio, s.line, refc.rotulo);
        while (subindo ? le() <= limite : le() >= limite) {
          if (++passos > MAX_PASSOS) throw new PortugolError("Execução interrompida: possível laço infinito.", s.line);
          yield* execBloco(s.corpo);
          if (temPasso) refc.container[refc.key] = coageEscalar(refc.tipoEsc, le() + passo, s.line, refc.rotulo);
        }
        break;
      }
      case "chamada": {
        const proc = procedimentos[s.name];
        if (!proc)
          throw new PortugolError(`Procedimento "${s.raw}" não foi definido.`, s.line);
        if (s.args.length !== proc.params.length)
          throw new PortugolError(`O procedimento "${proc.raw}" espera ${proc.params.length} argumento(s), mas recebeu ${s.args.length}.`, s.line);

        const local = criaEscopo(global);
        // vincula os parâmetros avaliando os argumentos no escopo do CHAMADOR (escopo atual)
        for (let k = 0; k < proc.params.length; k++) {
          const par = proc.params[k], arg = s.args[k];
          if (par.porRef) {
            const alvoArg = argComoAlvo(arg);
            if (!alvoArg)
              throw new PortugolError(`O parâmetro "${par.raw}" é por referência (var); passe uma variável, não uma expressão.`, s.line);
            const r = resolveRef(alvoArg, s.line);
            checaTipoParam(par, r.info, s.line);
            local.tipos[par.name] = r.info;
            local.refs[par.name] = { container: r.container, key: r.key };
          } else if (par.tipo && (par.tipo.record || par.tipo.array)) {
            const alvoArg = argComoAlvo(arg);
            if (!alvoArg)
              throw new PortugolError(`O parâmetro "${par.raw}" é ${nomeTipo(par.tipo)}; passe uma variável.`, s.line);
            const r = resolveRef(alvoArg, s.line);
            checaTipoParam(par, r.info, s.line);
            local.tipos[par.name] = r.info;                        // info real (com dims, se vetor)
            local.store[par.name] = copiaValor(r.info, r.container[r.key]);  // cópia independente
          } else {
            const valor = avalia(arg);
            local.tipos[par.name] = par.tipo;
            local.store[par.name] = coageEscalar(par.tipo, valor, s.line, par.raw);
          }
        }

        const salvo = escopo;
        escopo = local;
        try {
          inicializaDecls(proc.decls, local);
          yield* execBloco(proc.corpo);
        } finally {
          escopo = salvo;
        }
        break;
      }
      default: throw new PortugolError(`Comando desconhecido: ${s.type}.`, s.line);
    }
  }

  // ---- helpers de procedimento ----
  function argComoAlvo(arg) {
    if (!arg) return null;
    if (arg.type === "var")   return { name: arg.name, raw: arg.raw, indices: null, field: null };
    if (arg.type === "index") return { name: arg.name, raw: arg.raw, indices: arg.indices, field: null };
    if (arg.type === "field") return { name: arg.base.name, raw: arg.base.raw, indices: arg.base.indices || null, field: arg.field, fieldRaw: arg.fieldRaw };
    return null;
  }
  function nomeTipo(t) {
    if (t && t.record) return `registro ${registros[t.record] ? registros[t.record].raw : t.record}`;
    if (t && t.array)  return `vetor de ${nomeTipo(t.base)}`;
    return String(t);
  }
  function mesmaBase(a, b) {
    if (a && a.record) return !!(b && b.record && a.record === b.record);
    if (a && a.array)  return !!(b && b.array && mesmaBase(a.base, b.base));
    return a === b;   // tipos escalares (strings)
  }
  function checaTipoParam(par, infoArg, line) {
    const pt = par.tipo;
    if (pt && pt.array) {
      if (!(infoArg && infoArg.array))
        throw new PortugolError(`O parâmetro "${par.raw}" é ${nomeTipo(pt)}, mas o argumento é ${nomeTipo(infoArg)}.`, line);
      if (!mesmaBase(pt.base, infoArg.base))
        throw new PortugolError(`O parâmetro "${par.raw}" é ${nomeTipo(pt)}, mas o argumento é ${nomeTipo(infoArg)}.`, line);
      return;
    }
    if (pt && pt.record) {
      if (!(infoArg && infoArg.record && infoArg.record === pt.record))
        throw new PortugolError(`O parâmetro "${par.raw}" é ${nomeTipo(pt)}, mas o argumento é ${nomeTipo(infoArg)}.`, line);
      return;
    }
    if (infoArg && (infoArg.array || infoArg.record))
      throw new PortugolError(`O parâmetro "${par.raw}" é ${pt}, mas o argumento é ${nomeTipo(infoArg)}.`, line);
    if (infoArg !== pt)
      throw new PortugolError(`O parâmetro "${par.raw}" é ${pt}, mas o argumento é ${infoArg}.`, line);
  }
  function copiaValor(info, v) {
    if (info && info.record) {
      const o = Object.create(null);
      const def = registros[info.record];
      for (const f of def.fields) o[f.name] = v[f.name];
      return o;
    }
    if (info && info.array) {
      return v.map(el => (info.base && info.base.record) ? copiaValor(info.base, el) : el);
    }
    return v;
  }

  yield* execBloco(programa.corpo);
}

/* -------------------------------------------------------------------- UI/DRIVER */
const $code    = document.getElementById("code");
const $console = document.getElementById("console");
const $gutter  = document.getElementById("gutter");
const $run     = document.getElementById("runBtn");
const $stop    = document.getElementById("stopBtn");
const $clear   = document.getElementById("clearBtn");
const $examples= document.getElementById("examples");

let rodando = false;
let cancelar = false;
let entradaAtual = null;              // { cancelar } da leitura em andamento (se houver)
const CANCELADO = Symbol("cancelado"); // sentinela devolvido quando o Parar cancela um leia

function atualizaGutter() {
  const linhas = $code.value.split("\n").length;
  let s = "";
  for (let i = 1; i <= linhas; i++) s += i + "\n";
  $gutter.textContent = s;
  $gutter.scrollTop = $code.scrollTop;
}
$code.addEventListener("input", atualizaGutter);
$code.addEventListener("scroll", () => { $gutter.scrollTop = $code.scrollTop; });
// Tab digita 4 espaços dentro do editor
$code.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = $code.selectionStart, en = $code.selectionEnd;
    $code.value = $code.value.slice(0, s) + "    " + $code.value.slice(en);
    $code.selectionStart = $code.selectionEnd = s + 4;
    atualizaGutter();
  }
});

function escreveConsole(text, cls) {
  const span = document.createElement("span");
  span.className = "out-line" + (cls ? " " + cls : "");
  span.textContent = text;
  $console.appendChild(span);
  $console.scrollTop = $console.scrollHeight;
}

function pedeEntrada(name, tipo) {
  return new Promise((resolve) => {
    const row = document.createElement("div");
    row.className = "input-row";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "» ";
    const input = document.createElement("input");
    input.type = "text";
    input.setAttribute("aria-label", `Entrada para ${name}`);
    row.appendChild(caret);
    row.appendChild(input);
    $console.appendChild(row);
    $console.scrollTop = $console.scrollHeight;
    input.focus();

    // finaliza a leitura: por envio (Enter) ou por cancelamento (botão Parar)
    const finalizar = (val, cancelado) => {
      if (entradaAtual === estado) entradaAtual = null;
      row.remove();
      if (!cancelado) escreveConsole(`» ${val}\n`, "echo");
      resolve(cancelado ? CANCELADO : val);
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finalizar(input.value, false); }
    });

    const estado = { cancelar: () => finalizar(null, true) };
    entradaAtual = estado;
  });
}

async function executar() {
  if (rodando) return;
  rodando = true; cancelar = false; entradaAtual = null;
  $run.disabled = true; $stop.disabled = false;
  $console.innerHTML = "";

  let programa;
  try {
    const tokens = lex($code.value);
    programa = parse(tokens);
  } catch (e) {
    if (e instanceof PortugolError) {
      escreveConsole(`Erro de sintaxe${e.line ? " (linha " + e.line + ")" : ""}: ${e.message}\n`, "err-msg");
    } else {
      escreveConsole("Erro inesperado: " + e.message + "\n", "err-msg");
    }
    encerra();
    return;
  }

  const gen = interpretar(programa);
  let enviar;
  let contadorSaidas = 0;
  try {
    while (true) {
      if (cancelar) { escreveConsole("\n[execução interrompida]\n", "sys-msg"); break; }
      const { value, done } = gen.next(enviar);
      enviar = undefined;
      if (done) { escreveConsole("\n[fim da execução]\n", "ok-msg"); break; }

      if (value.kind === "output") {
        escreveConsole(value.text);
        // solta a thread de vez em quando pra UI respirar em loops grandes
        if (++contadorSaidas % 200 === 0) await new Promise(r => setTimeout(r, 0));
      } else if (value.kind === "input") {
        enviar = await pedeEntrada(value.name, value.tipo);
        if (cancelar || enviar === CANCELADO) { escreveConsole("\n[execução interrompida]\n", "sys-msg"); break; }
      }
    }
  } catch (e) {
    if (e instanceof PortugolError) {
      escreveConsole(`\nErro em execução${e.line ? " (linha " + e.line + ")" : ""}: ${e.message}\n`, "err-msg");
    } else {
      escreveConsole("\nErro inesperado: " + e.message + "\n", "err-msg");
    }
  }
  encerra();
}

function encerra() {
  rodando = false;
  entradaAtual = null;
  $run.disabled = false;
  $stop.disabled = true;
}

$run.addEventListener("click", executar);
$stop.addEventListener("click", () => {
  cancelar = true;
  if (entradaAtual) entradaAtual.cancelar();  // desbloqueia um leia que estava esperando
});
$clear.addEventListener("click", () => { $console.innerHTML = ""; });

for (const nome of Object.keys(EXEMPLOS)) {
  const opt = document.createElement("option");
  opt.value = nome; opt.textContent = nome;
  $examples.appendChild(opt);
}
$examples.addEventListener("change", () => {
  if (EXEMPLOS[$examples.value]) {
    $code.value = EXEMPLOS[$examples.value];
    atualizaGutter();
    $examples.value = "";
  }
});

// carrega o primeiro exemplo ao abrir
$code.value = EXEMPLOS["Olá / leitura"];
atualizaGutter();
